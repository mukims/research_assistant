name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Install the package
        run: python -m pip install -e .

      - name: Run tests
        # Console output only — do not write into the project's data/logs/ directory.
        env:
          CITATION_LOG_FILE: "0"
        run: python -m pytest tests/ -v

      - name: Check every module still imports
        # tests/test_imports.py walks the whole research_assistant package; this
        # covers the three root entry points it cannot reach (they are scripts,
        # not package modules). C1 (a `from research_assistant import orchestrate`
        # inside app.py, where orchestrate.py is a root-level script) lived in
        # exactly that gap. langgraph and streamlit back these imports; both are
        # in requirements-test.txt. Modules needing the ML stack (chromadb, torch,
        # langchain embeddings) import it inside the functions that use it, so CI
        # deliberately does not install it.
        env:
          CITATION_LOG_FILE: "0"
        run: python -c "import app, orchestrate, watch"
